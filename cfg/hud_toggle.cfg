// HUD element toggle for clean recording.
// Hides everything except damage numbers (CDamageAccountPanel).
// Usage: exec hud_toggle, then press F9 (or run hud_off / hud_on / hud_toggle).
// Can also be driven over RCON per clip.

alias hud_off "testhudanim HideHudElements; alias hud_toggle hud_on; echo [hud_toggle] HUD hidden (damage numbers kept)"
alias hud_on  "testhudanim ShowHudElements; alias hud_toggle hud_off; echo [hud_toggle] HUD shown"
alias hud_toggle hud_off

bind F9 hud_toggle
